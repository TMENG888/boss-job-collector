<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 360px;
    margin: 0;
    padding: 14px;
    font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #26292e;
  }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; padding: 7px 0; border: 1px solid #e2e4ea; background: #f6f7f9;
    color: #6b7280; border-radius: 8px; font-size: 13px; cursor: pointer; position: relative;
  }
  .tabs button.active { background: #00bebc; border-color: #00bebc; color: #fff; font-weight: 600; }
  .tabs .badge {
    display: inline-block; min-width: 18px; margin-left: 5px; padding: 0 4px;
    border-radius: 9px; background: #e5e6eb; color: #555; font-size: 11px; font-weight: 400;
  }
  .tabs button.active .badge { background: rgba(255,255,255,.25); color: #fff; }
  .row { margin-bottom: 10px; }
  label { display: block; color: #6b7280; margin-bottom: 3px; font-size: 12px; }
  input[type="text"], input[type="number"], select {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none;
  }
  input:focus, select:focus { border-color: #00bebc; }
  .grid { display: flex; gap: 8px; }
  .grid > div { flex: 1; }
  .hint { color: #9aa0aa; font-size: 11px; margin-top: 3px; }
  button.op {
    width: 100%; padding: 8px 0; border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer;
  }
  .btn-start { background: #00bebc; color: #fff; font-weight: 600; }
  .btn-start:disabled { background: #b9c0c9; cursor: not-allowed; }
  .btn-stop { background: #feeceb; color: #e33e2b; }
  .btn-ghost { background: #f2f3f5; color: #555; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .btn-row button { flex: 1 1 40%; padding: 7px 0; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; margin-bottom: 6px; }
  .checkbox-row label { margin: 0; display: inline; color: #555; font-size: 12px; }
  .progress { background: #f2f3f5; border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  .progress .num { font-size: 20px; font-weight: 700; color: #00bebc; }
  .bar { height: 6px; background: #e5e6eb; border-radius: 3px; margin: 8px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #00bebc; width: 0; transition: width .3s; }
  .status { color: #8a919f; font-size: 12px; min-height: 18px; word-break: break-all; }
  .tips { color: #9aa0aa; font-size: 11px; margin-top: 10px; line-height: 1.55; }
  .shared { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #e5e6eb; }
</style>
</head>
<body>
  <h1>📋 岗位采集助手</h1>

  <div class="tabs">
    <button id="tabBoss" class="active">BOSS直聘<span class="badge" id="cntBoss">0</span></button>
    <button id="tabSx">实习僧<span class="badge" id="cntSx">0</span></button>
  </div>

  <div class="row">
    <label id="kwLabel">岗位关键词（多个用逗号分隔，采完一个自动接力下一个）</label>
    <input type="text" id="keyword" placeholder="如：智能体开发, RPA实习">
  </div>

  <div class="row grid">
    <div>
      <label id="cityLabel">城市（多个用逗号分隔接力；留空=全国）</label>
      <input type="text" id="city" placeholder="如：广州,杭州">
    </div>
    <div>
      <label>目标数量</label>
      <input type="number" id="target" min="1" max="5000" value="100">
    </div>
  </div>

  <div class="row checkbox-row">
    <input type="checkbox" id="useCurrent">
    <label for="useCurrent" id="useCurrentLabel">采集当前已打开的搜索页（忽略上方设置）</label>
  </div>
  <div class="row checkbox-row">
    <input type="checkbox" id="enrichCheck" checked>
    <label for="enrichCheck">采集后自动获取JD职位详情</label>
  </div>

  <button class="op btn-start" id="startBtn">开始采集</button>
  <div class="btn-row">
    <button class="op btn-stop" id="stopBtn">停止</button>
    <button class="op btn-ghost" id="exportBtn">导出CSV</button>
    <button class="op btn-ghost" id="jdBtn">补全JD</button>
    <button class="op btn-ghost" id="sanitizeBtn">校验修复</button>
    <button class="op btn-ghost" id="clearBtn">清空</button>
    <button class="op btn-ghost" id="logBtn" title="打开当日运行日志（跨天自动清空）">查看日志</button>
  </div>

  <div class="progress">
    <div><span class="num" id="count">0</span> / <span id="targetShow">100</span> 条</div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="status" id="status">空闲</div>
  </div>

  <div class="tips">
    两个平台可同时各自运行采集任务，互不干扰；JD详情按平台独立补全。<br>
    实习僧：详情页字段为明文，JD补全会顺带用明文覆盖列表页加密数字。
  </div>

  <script src="popup.js"></script>
</body>
</html>
